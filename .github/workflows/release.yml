name: Release

# Publishes the committed packs on a tag push. Tags are dated data releases:
#   packs-YYYY.MM.DD     (packs-YYYY.MM.DD.N for a second release on the same day)
# The archive data/word-lens-packs.tar.xz is unpacked and every pack checked against the
# manifest's sha256/size and parsed, then word-lens-<pair>.lens, word-lens-manifest.json and
# word-lens-ATTRIBUTION.md are attached to a non-prerelease release marked latest. CrossLingua
# devices download them from releases/latest/download/.

on:
  push:
    tags:
      - 'packs-*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^packs-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not packs-YYYY.MM.DD[.N]"
            exit 1
          fi

      - name: Tests
        run: python3 -m unittest discover -s tests -v

      - name: Stage assets
        # One asset per manifest pack, plus the manifest and the attribution.
        run: |
          set -euo pipefail
          expected="$(python3 -c 'import json, tarfile; t = tarfile.open("data/word-lens-packs.tar.xz"); print(len(json.load(t.extractfile("word-lens-manifest.json"))["packs"]) + 2)')"
          staged="$(python3 scripts/stage_release_assets.py --out dist --notes "$RUNNER_TEMP/notes.md")"
          test "$staged" -eq "$expected"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq "$expected"
          test "$(find dist -maxdepth 1 -type f -name 'word-lens-*.lens' | wc -l)" -eq "$((expected - 2))"
          test -f dist/word-lens-manifest.json
          test -f dist/word-lens-ATTRIBUTION.md
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            # A re-run: refresh the assets and keep the release latest.
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --prerelease=false --draft=false --latest --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$tag" dist/* --verify-tag --latest \
              --title "Word Lens packs ${tag#packs-}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release view "$tag" --json assets --jq '.assets[].name'
